# =====================================================================
#  KONFIGURATION DER BÖRSEN-ÜBERSICHT
# ---------------------------------------------------------------------
#  Diese Datei kannst du direkt auf github.com bearbeiten (Stift-Symbol).
#  Regeln für YAML-Dateien:
#    - Einrückung immer mit LEERZEICHEN (keine Tabs!)
#    - Zeilen, die mit "#" beginnen, sind Kommentare und werden ignoriert
#    - Jeder Eintrag in einer Liste beginnt mit "- "
#  Symbole (Ticker) findest du auf https://finance.yahoo.com
#  (z.B. Suche "Nestle" -> Symbol "NESN.SW"; Schweizer Titel enden auf .SW)
# =====================================================================

# Zeitzone, in der alle Zeiten angezeigt werden
zeitzone: "Europe/Zurich"

# ---------------------------------------------------------------------
# INDIZES  (Kachel mit Mini-Chart)
#   symbol  = Yahoo-Finance-Symbol
#   name    = Anzeigename
#   region  = Schweiz / USA / Europa  (für Gruppierung und Börsenstatus)
#   stooq   = (optional) Ersatz-Symbol bei stooq.com, falls Yahoo ausfällt
# ---------------------------------------------------------------------
indizes:
  - { symbol: "^SSMI",     name: "SMI",           region: "Schweiz", stooq: "^smi" }
  - { symbol: "^SSHI",     name: "SPI",           region: "Schweiz" }
  - { symbol: "^GSPC",     name: "S&P 500",       region: "USA",     stooq: "^spx" }
  - { symbol: "^IXIC",     name: "Nasdaq",        region: "USA",     stooq: "^ndq" }
  - { symbol: "^DJI",      name: "Dow Jones",     region: "USA",     stooq: "^dji" }
  - { symbol: "^GDAXI",    name: "DAX",           region: "Europa",  stooq: "^dax" }
  - { symbol: "^STOXX50E", name: "Euro Stoxx 50", region: "Europa" }

# ---------------------------------------------------------------------
# AKTIEN – geordnet nach SEKTOR (Branche)
#   So fügst du eine Aktie hinzu: im passenden Sektor eine Zeile einfügen:
#       - { symbol: "SGSN.SW", name: "SGS" }
#   Neuer Sektor: einfach eine neue Überschrift im gleichen Format anlegen:
#     "Mein Sektor":
#       - { symbol: "...", name: "..." }
#   Entfernen: Zeile löschen (oder ein "#" an den Anfang setzen).
#
#   Das Land wird am Symbol erkannt:
#     .SW = Schweiz · ohne Endung = USA · .DE = Deutschland · .T = Japan
#   Schweizer und US-Titel erscheinen zusätzlich bei "Top & Flop".
#   Optional pro Aktie:
#     alternativ = Ersatz-Symbole, falls das erste keine Daten liefert
#     stooq      = Ersatz-Symbol bei stooq.com
#   Eine Aktie darf in mehreren Sektoren stehen (z.B. Honeywell).
# ---------------------------------------------------------------------
aktien:
