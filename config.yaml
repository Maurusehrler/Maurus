# ---------------------------------------------------------------------
# ETFs / FONDS (Bereich "Märkte")
#   isin   = ISIN des Produkts; das Skript sucht das Yahoo-Symbol selbst
#   symbol = (optional) Yahoo-Symbol direkt angeben, falls bekannt
#   boerse = bevorzugte Börse(n) bei der Suche (Endung des Symbols)
#   name   = Anzeigename; "auto" = offiziellen Namen bei Yahoo abfragen
# ---------------------------------------------------------------------
etfs:
  - { isin: "IE00BD4TYL27", name: "auto", boerse: [".SW", ".L", ".DE", ".AS", ".MI"] }

# ---------------------------------------------------------------------
# US-SEKTOREN (S&P 500) – gemessen an den Sektor-ETFs von SPDR.
#   Zeigt, welche Branchen in den USA insgesamt gewinnen/verlieren.
# ---------------------------------------------------------------------
sektoren_us:
  - { symbol: "XLK",  name: "Technologie" }
  - { symbol: "XLC",  name: "Kommunikation" }
  - { symbol: "XLY",  name: "Konsum (zyklisch)" }
  - { symbol: "XLP",  name: "Konsum (Basis)" }
  - { symbol: "XLV",  name: "Gesundheit" }
  - { symbol: "XLF",  name: "Finanzen" }
  - { symbol: "XLI",  name: "Industrie" }
  - { symbol: "XLE",  name: "Energie" }
  - { symbol: "XLB",  name: "Grundstoffe" }
  - { symbol: "XLU",  name: "Versorger" }
  - { symbol: "XLRE", name: "Immobilien" }

# ---------------------------------------------------------------------
# KRYPTO
#   coingecko = ID bei CoinGecko (steht in der Adresse, z.B.
#               coingecko.com/de/munze/bitcoin -> "bitcoin")
#   symbol    = Yahoo-Symbol als Ersatzquelle
# ---------------------------------------------------------------------
krypto:
  - { coingecko: "bitcoin",  symbol: "BTC-USD", name: "Bitcoin" }
  - { coingecko: "ethereum", symbol: "ETH-USD", name: "Ethereum" }

# ---------------------------------------------------------------------
# ROHSTOFFE (Futures-Kontrakte bei Yahoo)
# ---------------------------------------------------------------------
rohstoffe:
  - { symbol: "GC=F", name: "Gold",       einheit: "USD/oz" }
  - { symbol: "SI=F", name: "Silber",     einheit: "USD/oz" }
  - { symbol: "BZ=F", name: "Öl (Brent)", einheit: "USD/Fass" }
  - { symbol: "CL=F", name: "Öl (WTI)",   einheit: "USD/Fass" }

# ---------------------------------------------------------------------
# DEVISEN
#   basis/ziel = Währungscodes für die Ersatzquelle (EZB-Kurse via frankfurter.app)
# ---------------------------------------------------------------------
devisen:
  - { symbol: "USDCHF=X", name: "USD/CHF", basis: "USD", ziel: "CHF" }
  - { symbol: "EURCHF=X", name: "EUR/CHF", basis: "EUR", ziel: "CHF" }
  - { symbol: "EURUSD=X", name: "EUR/USD", basis: "EUR", ziel: "USD" }

# ---------------------------------------------------------------------
# WEITERE INDIKATOREN
# ---------------------------------------------------------------------
weitere:
  - { symbol: "^VIX", name: "VIX (Volatilität)",     einheit: "Punkte" }
  - { symbol: "^TNX", name: "US-Rendite 10 Jahre",   einheit: "%" }

# ---------------------------------------------------------------------
# AUFFÄLLIGKEITEN: ab welcher Tagesbewegung (in %) ein Hinweis erscheint
# ---------------------------------------------------------------------
schwellen:
  index: 2.0
  aktie: 5.0
  # eigene Schwellen für schwankungsfreudige Sektoren (sonst zu viele Hinweise)
  sektoren:
    "Bitcoin": 10.0
    "Quanten": 10.0
  krypto: 5.0
  rohstoff: 3.0
  devisen: 1.0
  weitere: 10.0

# ---------------------------------------------------------------------
# NEWS (RSS-Feeds)
#   Feeds, die nicht funktionieren, werden einfach übersprungen.
#   In der App siehst du ganz unten unter "Datenquellen", welche Feeds
#   beim letzten Lauf funktioniert haben.
# ---------------------------------------------------------------------
news:
  max_artikel: 25            # so viele Schlagzeilen werden angezeigt
  max_alter_stunden: 36      # ältere Meldungen werden weggelassen
  max_pro_quelle: 5          # damit nicht eine Quelle alles dominiert
  #   (Getestet am 26.11.2026. cash.ch, Handelszeitung, FuW, finanzen.ch und
  #    Yahoo bieten derzeit keinen frei nutzbaren RSS-Feed an.)
  #   region = CH (Schweiz) oder INT (international) – für den Filter in der App
  #   bonus = Zusatzpunkte für die Quelle (höher = weiter oben). So kommen
  #           Schweizer Meldungen vor allgemeinen internationalen News.
  feeds:
    # --- Schweiz ---
    - { name: "NZZ Wirtschaft",  region: "CH", bonus: 4, url: "https://www.nzz.ch/wirtschaft.rss" }
    - { name: "NZZ Finanzen",    region: "CH", bonus: 4, url: "https://www.nzz.ch/finanzen.rss" }
    - { name: "finews.ch",       region: "CH", bonus: 4, url: "https://www.finews.ch/news/finanzplatz?format=feed&type=rss" }
    - { name: "finews.ch",       region: "CH", bonus: 4, url: "https://www.finews.ch/?format=feed&type=rss" }
    - { name: "SRF Wirtschaft",  region: "CH", bonus: 4, url: "https://www.srf.ch/news/bnf/rss/1926" }
    - { name: "SNB",             region: "CH", bonus: 4, url: "https://www.snb.ch/public/de/rss/news" }
    # --- Deutschland / Europa ---
    - { name: "tagesschau Wirtschaft", region: "INT", bonus: 2, url: "https://www.tagesschau.de/wirtschaft/index~rss2.xml" }
    - { name: "EZB",             region: "INT", bonus: 1, url: "https://www.ecb.europa.eu/rss/press.html" }
    # --- International ---
    - { name: "CNBC",            region: "INT", bonus: 0, url: "https://www.cnbc.com/id/100003114/device/rss/rss.html" }
    - { name: "CNBC Markets",    region: "INT", bonus: 1, url: "https://www.cnbc.com/id/15839069/device/rss/rss.html" }
    - { name: "MarketWatch",     region: "INT", bonus: 0, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories" }
    - { name: "BBC Business",    region: "INT", bonus: 0, url: "https://feeds.bbci.co.uk/news/business/rss.xml" }
    - { name: "Federal Reserve", region: "INT", bonus: 2, url: "https://www.federalreserve.gov/feeds/press_monetary.xml" }

  # Stichwörter, die eine Meldung wichtiger machen (Gewicht = Zusatzpunkte).
  # Die Namen deiner Aktien von oben werden automatisch auch berücksichtigt.
  stichwoerter:
    SNB: 5
    Nationalbank: 5
    Notenbank: 4
    Fed: 4
    EZB: 4
    ECB: 4
    Zins: 3
    Leitzins: 5
    "rate cut": 4
    "interest rate": 3
    Inflation: 4
    Teuerung: 4
    Powell: 3
    Lagarde: 3
    Schlegel: 3
    Franken: 3
    SMI: 3
    Börse: 2
    Rezession: 3
    recession: 3
    Zölle: 2
    tariff: 2
    Quartalszahlen: 2
    earnings: 2
    Wall Street: 2
    Bitcoin: 2
    Gold: 1
    Öl: 1
    Ölpreis: 1
    # englische Begriffe (für internationale Feeds)
    "Swiss": 3
    franc: 3
    inflation: 3
    "S&P 500": 2
    Nasdaq: 2
    stocks: 1
    Treasury: 2
    yields: 2

# ---------------------------------------------------------------------
# WIRTSCHAFTSKALENDER
# ---------------------------------------------------------------------
kalender:
  # Währungsräume aus dem automatischen Kalender (Quelle: ForexFactory-Wochenkalender)
  waehrungen: ["CHF", "USD", "EUR"]
  # Welche Wichtigkeit wird gezeigt? (High = hoch, Medium = mittel)
  wichtigkeit: ["High"]
  # Für Schweizer Termine zusätzlich auch "Medium" zeigen?
  chf_auch_mittel: true
  # Quartalszahlen der eigenen Aktien in den nächsten X Tagen anzeigen
  quartalszahlen_tage: 14

  # Fixe Termine, die du selbst pflegst (Format: Datum JJJJ-MM-TT).
  # Bitte einmal pro Jahr auf snb.ch / federalreserve.gov / ecb.europa.eu prüfen.
  eigene_termine:
    - { datum: "2026-12-09", titel: "Fed-Zinsentscheid (USA)" }
    - { datum: "2026-12-10", titel: "SNB geldpolitische Lagebeurteilung" }
    - { datum: "2026-12-17", titel: "EZB-Zinsentscheid" }
    - { datum: "2027-01-27", titel: "Fed-Zinsentscheid (USA)" }
    - { datum: "2027-02-04", titel: "EZB-Zinsentscheid" }
    - { datum: "2027-03-18", titel: "SNB geldpolitische Lagebeurteilung" }
    - { datum: "2027-03-18", titel: "EZB-Zinsentscheid" }
    - { datum: "2027-04-29", titel: "EZB-Zinsentscheid" }
    - { datum: "2027-06-10", titel: "EZB-Zinsentscheid" }
    - { datum: "2027-06-24", titel: "SNB geldpolitische Lagebeurteilung" }
    - { datum: "2027-07-22", titel: "EZB-Zinsentscheid" }
    - { datum: "2027-09-23", titel: "SNB geldpolitische Lagebeurteilung" }
    - { datum: "2027-12-16", titel: "SNB geldpolitische Lagebeurteilung" }
    - { datum: "2027-12-16", titel: "EZB-Zinsentscheid" }

# ---------------------------------------------------------------------
