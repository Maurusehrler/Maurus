# =====================================================================
#  STECKBRIEFE – kurze Porträts für "Aktie des Tages" und die Detailansicht
# ---------------------------------------------------------------------
#  Pro Aktie (Symbol wie in config.yaml):
#    was      = Was macht das Unternehmen? (1–2 Sätze)
#    chancen  = Was spricht dafür?
#    risiken  = Worauf muss man achten?
#    fakt     = (optional) "Wusstest du?"
#  Fehlt ein Steckbrief, zeigt die App die englische Beschreibung von Yahoo.
#  Allgemeine Einschätzungen ohne Gewähr – keine Anlageberatung.
# =====================================================================

# ---------------------------- Technologie ----------------------------
AAPL:
  was: "Apple entwickelt iPhone, Mac, iPad, Apple Watch und verdient zunehmend mit Diensten wie App Store, iCloud, Apple Music und Apple Pay."
  chancen: "Sehr treue Kundschaft, starkes Ökosystem, hohe Margen im Service-Geschäft und grosse Aktienrückkäufe."
  risiken: "Abhängigkeit vom iPhone, Produktion stark in Asien, Regulierung des App Stores."
  fakt: "Apple kauft seit Jahren für Dutzende Milliarden Dollar pro Jahr eigene Aktien zurück."
MSFT:
  was: "Microsoft verkauft Software (Windows, Office 365), betreibt die Cloud-Plattform Azure und besitzt LinkedIn sowie die Xbox-Sparte."
  chancen: "Azure und KI-Dienste wachsen stark, Abo-Modelle bringen planbare Einnahmen."
  risiken: "Sehr hohe Investitionen in Rechenzentren, Wettbewerb mit Amazon und Google in der Cloud, Kartellbehörden."
NVDA:
  was: "Nvidia entwickelt Grafikchips (GPUs), die heute vor allem in Rechenzentren für künstliche Intelligenz eingesetzt werden."
  chancen: "Marktführer bei KI-Chips mit eigener Software-Plattform (CUDA), enorme Nachfrage der Cloud-Anbieter."
  risiken: "Hohe Bewertung, Abhängigkeit von wenigen Grosskunden, Exportbeschränkungen nach China, zyklische Chipbranche."
  fakt: "Nvidia stellt seine Chips nicht selbst her – gefertigt wird beim taiwanischen Auftragsfertiger TSMC."
AVGO:
  was: "Broadcom stellt Netzwerk- und Spezialchips her (auch massgeschneiderte KI-Chips) und verkauft Infrastruktur-Software wie VMware."
  chancen: "Profitiert vom Ausbau der KI-Rechenzentren, hohe Margen, wachsende Dividende."
  risiken: "Hohe Schulden nach Übernahmen, Abhängigkeit von Grosskunden wie Apple und Google."
ORCL:
  was: "Oracle ist bekannt für Datenbank-Software und baut stark seine Cloud-Infrastruktur für KI-Anwendungen aus."
  chancen: "Grosse Cloud-Aufträge, viele treue Firmenkunden mit Oracle-Datenbanken."
  risiken: "Sehr hohe Investitionen und steigende Verschuldung, Konkurrenz durch die grossen Cloud-Anbieter."
AMD:
  was: "AMD entwickelt Prozessoren (CPUs) und Grafikchips für PCs, Spielkonsolen und Rechenzentren."
  chancen: "Gewinnt Marktanteile bei Server-Prozessoren, wächst mit KI-Beschleunigern."
  risiken: "Starke Konkurrenz durch Nvidia und Intel, zyklische Nachfrage nach PCs."
CRM:
  was: "Salesforce ist Weltmarktführer für Kundenmanagement-Software (CRM) aus der Cloud."
  chancen: "Abo-Einnahmen, hohe Kundenbindung, neue KI-Funktionen (Agenten)."
  risiken: "Wachstum verlangsamt sich, Konkurrenz durch Microsoft, teure Übernahmen."
LOGN.SW:
  was: "Logitech stellt Computerzubehör her: Mäuse, Tastaturen, Webcams, Gaming-Zubehör und Videokonferenz-Systeme."
  chancen: "Starke Marke, solide Bilanz ohne Schulden, Gaming- und Büro-Markt."
  risiken: "Nachfrage schwankt stark mit PC-Verkäufen, Preisdruck, Zölle auf Produkte aus Asien."
  fakt: "Logitech wurde 1981 in Apples (Kanton Waadt) gegründet."
VACN.SW:
  was: "VAT Group ist Weltmarktführer für Vakuumventile, die vor allem in der Chipherstellung benötigt werden."
  chancen: "Sehr hoher Marktanteil, profitiert von neuen Chipfabriken weltweit."
  risiken: "Stark abhängig vom Investitionszyklus der Halbleiterindustrie, hohe Bewertung."
TEMN.SW:
  was: "Temenos liefert Kernbanken-Software, mit der Banken ihre Konten, Zahlungen und Kredite verwalten."
  chancen: "Viele Banken modernisieren ihre IT und wechseln in die Cloud."
  risiken: "Lange Verkaufszyklen, Wettbewerb, Unsicherheit nach Management-Wechseln in der Vergangenheit."

# ---------------------- Kommunikation & Telekom ----------------------
GOOGL:
  was: "Alphabet ist die Muttergesellschaft von Google: Suchmaschine, YouTube, Android, Google Cloud und das KI-Labor DeepMind."
  chancen: "Dominanz bei Suche und Online-Werbung, wachsende Cloud, starke KI-Forschung."
  risiken: "KI-Chatbots könnten die Google-Suche verändern, Kartellverfahren in den USA und der EU."
META:
  was: "Meta betreibt Facebook, Instagram und WhatsApp und verdient fast alles mit Online-Werbung."
  chancen: "Über 3 Milliarden Nutzer täglich, sehr profitables Werbegeschäft, KI verbessert die Werbung."
  risiken: "Hohe Ausgaben für KI und Metaverse, Regulierung, Abhängigkeit von Werbebudgets."
NFLX:
  was: "Netflix ist der grösste Streamingdienst der Welt für Serien und Filme."
  chancen: "Über 300 Millionen Abonnenten, Werbe-Abo und Preiserhöhungen steigern den Umsatz."
  risiken: "Hohe Kosten für Inhalte, starke Konkurrenz (Disney+, Amazon, YouTube)."
TMUS:
  was: "T-Mobile US ist einer der drei grossen Mobilfunkanbieter der USA (Mehrheitsaktionärin ist die Deutsche Telekom)."
  chancen: "Bestes 5G-Netz in den USA, wächst schneller als die Konkurrenz."
  risiken: "Gesättigter Markt, Preiskampf, hohe Schulden für Netz und Frequenzen."
DIS:
  was: "Disney betreibt Freizeitparks, Kreuzfahrten, Filmstudios (Marvel, Pixar, Star Wars), TV-Sender und Disney+."
  chancen: "Einzigartige Marken und Figuren, Freizeitparks sehr profitabel, Streaming wird profitabel."
  risiken: "Klassisches Fernsehen schrumpft, Parks hängen von der Konjunktur ab."
VZ:
  was: "Verizon ist ein grosser US-Telekomkonzern für Mobilfunk und Glasfaser-Internet."
  chancen: "Stabile Einnahmen und hohe Dividende."
  risiken: "Kaum Wachstum, hohe Schulden, starke Konkurrenz."
SCMN.SW:
  was: "Swisscom ist die grösste Telekomfirma der Schweiz (Mobilfunk, Internet, TV) und besitzt die italienische Fastweb."
  chancen: "Sehr stabiles Geschäft, verlässliche Dividende, Mehrheitsaktionär ist der Bund."
  risiken: "Kaum Wachstum in der Schweiz, Preisdruck, Risiken im Italien-Geschäft."

# -------------------- Konsum (zyklisch & Luxus) ----------------------
AMZN:
  was: "Amazon ist der grösste Online-Händler im Westen und mit AWS der grösste Cloud-Anbieter der Welt."
  chancen: "AWS sehr profitabel, Werbegeschäft wächst stark, Prime bindet Kunden."
  risiken: "Hohe Investitionen, dünne Margen im Handel, Kartellbehörden."
TSLA:
  was: "Tesla baut Elektroautos und Batteriespeicher und arbeitet an selbstfahrenden Autos und Robotern."
  chancen: "Starke Marke, Software und Energiespeicher, mögliches Robotaxi-Geschäft."
  risiken: "Sehr hohe Bewertung, sinkende Preise bei E-Autos, starke chinesische Konkurrenz, Abhängigkeit von Elon Musk."
HD:
  was: "Home Depot ist die grösste Baumarktkette der Welt (USA, Kanada, Mexiko)."
  chancen: "Profitiert von Renovationen und alternden Häusern in den USA, starke Marktstellung."
  risiken: "Abhängig vom Immobilienmarkt und von Zinsen."
MCD:
  was: "McDonald's ist die grösste Fast-Food-Kette der Welt; die meisten Restaurants werden von Franchisenehmern betrieben."
  chancen: "Verdient an Mieten und Lizenzgebühren, sehr stabil, wachsende Dividende seit Jahrzehnten."
  risiken: "Preisempfindliche Kundschaft, Trend zu gesünderer Ernährung."
  fakt: "Ein grosser Teil des Gewinns stammt aus Mieten – McDonald's besitzt viele Grundstücke seiner Restaurants."
BKNG:
  was: "Booking Holdings betreibt Reiseplattformen wie Booking.com, Priceline, Kayak und OpenTable."
  chancen: "Reisen wächst weltweit, sehr hohe Margen, grosse Aktienrückkäufe."
  risiken: "Abhängig von Reiselust und Konjunktur, Konkurrenz durch Google und KI-Assistenten."
NKE:
  was: "Nike ist der weltgrösste Sportartikelhersteller (Schuhe, Bekleidung, Ausrüstung)."
  chancen: "Weltbekannte Marke, Erholungspotenzial nach schwierigen Jahren."
  risiken: "Konkurrenz durch neue Marken (On, Hoka), Zölle, schwächere Nachfrage in China."
CFR.SW:
  was: "Richemont besitzt Schmuck- und Uhrenmarken wie Cartier, Van Cleef & Arpels, IWC und Jaeger-LeCoultre."
  chancen: "Schmuck wächst stabil, sehr starke Marken, Preissetzungsmacht."
  risiken: "Abhängig von reicher Kundschaft und China, Uhrengeschäft schwankt."
UHR.SW:
  was: "Swatch Group ist der grösste Uhrenkonzern der Welt (Omega, Longines, Tissot, Swatch) und stellt auch Uhrwerke her."
  chancen: "Starke Marken in allen Preisklassen, Erholungspotenzial."
  risiken: "Schwache Nachfrage in China, hohe Fixkosten, Smartwatch-Konkurrenz."

# --------------------------- Konsum (Basis) ---------------------------
NESN.SW:
  was: "Nestlé ist der grösste Nahrungsmittelkonzern der Welt (Nespresso, Maggi, KitKat, Purina-Tierfutter, Babynahrung)."
  chancen: "Sehr breit aufgestellt, Produkte werden auch in Krisen gekauft, Dividende steigt seit Jahrzehnten."
  risiken: "Schwaches Wachstum zuletzt, starker Franken drückt die Zahlen, Rohstoffpreise (Kaffee, Kakao)."
  fakt: "Nestlé erhöht die Dividende seit über 25 Jahren jedes Jahr."
WMT:
  was: "Walmart ist der grösste Detailhändler der Welt mit Supermärkten, Sam's Club und wachsendem Onlinehandel."
  chancen: "Tiefe Preise ziehen Kunden in jeder Konjunkturlage an, Werbe- und Online-Geschäft wachsen."
  risiken: "Sehr dünne Margen, hohe Bewertung für einen Händler."
COST:
  was: "Costco betreibt grosse Mitglieder-Lagerhäuser: Kunden zahlen eine Jahresgebühr und kaufen dafür günstig in grossen Mengen."
  chancen: "Sehr treue Mitglieder (über 90 % verlängern), stabile Einnahmen aus Mitgliedergebühren."
  risiken: "Sehr hohe Bewertung, dünne Margen."
PG:
  was: "Procter & Gamble stellt Alltagsprodukte her: Pampers, Gillette, Ariel, Head & Shoulders, Oral-B."
  chancen: "Starke Marken, stabile Nachfrage, über 60 Jahre steigende Dividende."
  risiken: "Langsames Wachstum, Konkurrenz durch günstige Eigenmarken."
KO:
  was: "Coca-Cola verkauft Getränke-Konzentrate und Marken (Coca-Cola, Fanta, Sprite) an Abfüller in über 200 Ländern."
  chancen: "Eine der bekanntesten Marken der Welt, hohe Margen, steigende Dividende seit über 60 Jahren."
  risiken: "Trend zu weniger Zucker, Währungsschwankungen."
  fakt: "Warren Buffetts Berkshire Hathaway hält seit 1988 Coca-Cola-Aktien."
PEP:
  was: "PepsiCo verkauft Getränke (Pepsi, Gatorade) und Snacks (Lay's, Doritos, Quaker)."
  chancen: "Snacks sind sehr profitabel, breite Markenpalette, stabile Dividende."
  risiken: "Schwächeres Volumen, Abnehmspritzen könnten den Snack-Konsum senken."
LISP.SW:
  was: "Lindt & Sprüngli ist ein Schweizer Hersteller von Premium-Schokolade (Lindor, Excellence, Goldhase; auch Ghirardelli und Russell Stover)."
  chancen: "Starke Premium-Marke, wächst zuverlässig, eigene Läden weltweit."
  risiken: "Stark gestiegene Kakaopreise, sehr hoher Aktienkurs pro Stück."
BARN.SW:
  was: "Barry Callebaut ist der weltgrösste Hersteller von Schokolade und Kakaoprodukten für die Lebensmittelindustrie."
  chancen: "Weltmarktführer, langfristige Verträge mit Grosskunden."
  risiken: "Extrem schwankende Kakaopreise, hohe Schulden, Umbau des Konzerns."

# ----------------------------- Gesundheit -----------------------------
NOVN.SW:
  was: "Novartis ist ein Schweizer Pharmakonzern mit innovativen Medikamenten, u.a. gegen Herzschwäche (Entresto), Krebs und Autoimmunkrankheiten."
  chancen: "Fokus auf patentgeschützte Medikamente, volle Pipeline, hohe Dividende."
  risiken: "Patentabläufe wichtiger Medikamente, Preisdruck in den USA."
ROG.SW:
  was: "Roche ist ein Schweizer Pharma- und Diagnostikkonzern: Krebsmedikamente, Augenheilkunde und Labortests."
  chancen: "Weltmarktführer in der Diagnostik, starke Forschung, Dividende steigt seit über 35 Jahren."
  risiken: "Konkurrenz durch Nachahmer (Biosimilars), Rückschläge in der Forschung."
  fakt: "Die Gründerfamilien Hoffmann und Oeri kontrollieren noch immer die Mehrheit der Stimmrechte."
LONN.SW:
  was: "Lonza stellt im Auftrag anderer Firmen Medikamente her – besonders biotechnologische Wirkstoffe."
  chancen: "Biotech-Medikamente boomen, langfristige Verträge, Ausbau der Kapazitäten in den USA."
  risiken: "Hohe Investitionen, Abhängigkeit von wenigen Grosskunden."
ALC.SW:
  was: "Alcon ist Weltmarktführer für Augenheilkunde: Kontaktlinsen, Augentropfen und Geräte für Augenoperationen."
  chancen: "Alternde Bevölkerung braucht mehr Grauer-Star-Operationen."
  risiken: "Starke Konkurrenz bei Kontaktlinsen, Preisdruck."
GALD.SW:
  was: "Galderma ist ein Dermatologie-Spezialist: Hautpflege (Cetaphil), Ästhetik (Restylane, Dysport) und Medikamente für die Haut."
  chancen: "Schnell wachsender Markt für ästhetische Behandlungen, neues Medikament gegen Hautkrankheiten (Nemluvio)."
  risiken: "Relativ hohe Schulden und Bewertung, Konkurrenz im Ästhetik-Markt."
SOON.SW:
  was: "Sonova ist Weltmarktführer für Hörgeräte (Phonak) und Cochlea-Implantate."
  chancen: "Alternde Bevölkerung, viele Menschen mit Hörverlust sind noch unversorgt."
  risiken: "Konkurrenz durch günstige rezeptfreie Hörgeräte, Konsumflaute."
LLY:
  was: "Eli Lilly ist ein US-Pharmakonzern und mit den Abnehm- und Diabetes-Medikamenten Mounjaro und Zepbound führend."
  chancen: "Riesiger Markt für Abnehmspritzen, starkes Umsatzwachstum, Pillen-Version in Entwicklung."
  risiken: "Sehr hohe Bewertung, Preisdruck und Konkurrenz (Novo Nordisk)."
JNJ:
  was: "Johnson & Johnson ist ein breit aufgestellter Gesundheitskonzern mit Medikamenten und Medizintechnik."
  chancen: "Sehr solide Bilanz, Dividende steigt seit über 60 Jahren."
  risiken: "Rechtsstreitigkeiten (Talkum), Patentabläufe."
UNH:
  was: "UnitedHealth ist der grösste Krankenversicherer der USA und betreibt mit Optum auch Arztpraxen und Gesundheitsdienste."
  chancen: "Riesige Grösse, wachsender Gesundheitsmarkt."
  risiken: "Stark gestiegene Behandlungskosten, Untersuchungen durch Behörden, politische Risiken."
ABBV:
  was: "AbbVie ist ein US-Biopharma-Konzern mit Medikamenten gegen Autoimmunkrankheiten (Skyrizi, Rinvoq) und Botox."
  chancen: "Nachfolger für das alte Erfolgsmedikament Humira wachsen stark, hohe Dividende."
  risiken: "Hohe Schulden, Patentabläufe."

