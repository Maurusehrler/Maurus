# =====================================================================
#  Kursalarme: alle 30 Minuten (Mo–Fr, ca. 08:00–22:30 Schweizer Zeit)
#  Prüft die Alarme aus config.yaml und schickt eine Push-Nachricht (ntfy).
# =====================================================================
name: Kursalarme prüfen

on:
  schedule:
    - cron: "5,35 6-21 * * 1-5"     # UTC; deckt Sommer- und Winterzeit ab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kursalarme
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Alarme prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/alarme.py
      - name: Status speichern (nur wenn ein Alarm ausgelöst hat)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/alarme_status.json 2>/dev/null || exit 0
          git diff --staged --quiet && exit 0
          git commit -m "Kursalarme: Status"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
